# Supabase CLI configuration for the LOCAL stack (`pnpm db:start`).
#
# Nothing here affects the deployed project — that is configured in the
# dashboard. This file exists so `supabase start` and `supabase db reset` give
# every developer and CI the same database to test policies against.

# Names the local Docker containers and nothing else. Change it if you run two
# of these side by side on one machine, or they will fight over the same stack.
project_id = "niftic-app"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# Match the deployed project. A policy that behaves differently on a different
# major version is a bad surprise to have in production only.
major_version = 17

[studio]
enabled = true
port = 54323

# Catches outbound mail locally instead of sending it. Auth emails — confirm,
# reset, invite — land here during development.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# The template's client mode requires a confirmed address before sign-in, and
# the local stack should behave the same way — otherwise the flow you test is
# not the flow you ship.
enable_confirmations = true
double_confirm_changes = true

[storage]
enabled = true
file_size_limit = "10MiB"
