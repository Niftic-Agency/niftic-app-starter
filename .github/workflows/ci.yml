name: ci

# The GENERATED app's CI. This file survives configure.
#
# Fast and dependency-free on PRs: no database, no external service. Profile-aware
# additions on main (migrations, integration tests) are appended per branch as
# those milestones land.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholders so the build can resolve env without real secrets. The env
      # module validates lazily, so nothing here is contacted at build time.
      ORIGIN: 'http://localhost:5173'
      EMAIL_DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm build
