name: starter

# The starter's own CI. Deleted by `pnpm configure`, so it never runs in a
# generated app.
#
# The product here is the GENERATOR, not any single app, so the job that matters
# most is `preset`: it configures a fresh copy per profile and then runs that
# app's own checks. A green `engine` job is necessary but nowhere near sufficient.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: starter-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  engine:
    name: engine + base tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:unit
      # The superset builds using the provisional adapter. If base stops
      # building, we want to know on the PR that broke it, not in the matrix.
      - run: pnpm build

      # Spec §14: a direct Postgres connection string must not appear as an
      # EXAMPLE anywhere. Prose telling you never to use one is fine, and so is
      # the negative fixture in connection.test.ts — this looks for a remote
      # `postgres://…:5432` that someone might copy.
      - name: No direct Postgres connection string in docs or examples
        run: |
          set -euo pipefail
          if grep -rnE 'postgres(ql)?://[^ "'"'"']*:5432' \
               docs README.md variants/*/variant.json scripts/configure/presets \
               2>/dev/null | grep -v 'localhost\|127\.0\.0\.1'; then
            echo "::error::a direct Postgres connection string is being shown as an example"
            exit 1
          fi

  determinism:
    name: deterministic output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure the same manifest twice and diff, with no exclusions
        run: |
          set -euo pipefail
          for n in a b; do
            rm -rf "$RUNNER_TEMP/$n" && mkdir -p "$RUNNER_TEMP/$n"
            # git archive respects .gitignore, so node_modules and .svelte-kit
            # never come along. cp -r would drag both.
            git archive HEAD | tar -x -C "$RUNNER_TEMP/$n"
            cp scripts/configure/presets/_m0-turso-minimal.yml "$RUNNER_TEMP/$n/niftic.app.yml"
            ( cd "$RUNNER_TEMP/$n" && SOURCE_DATE_EPOCH=0 \
                node_modules/.bin/tsx scripts/configure/index.ts --yes --no-install )
          done
          # SOURCE_DATE_EPOCH pins the one non-deterministic field (generated.at),
          # so this diff needs no exclusions at all.
          diff -r "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"

  preset:
    name: preset ${{ matrix.preset }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Implemented today. `seed` marks the lanes that have a user table and
          # therefore an admin to sign the auth smoke in as.
          - preset: _m0-turso-minimal # db + host only
            experimental: false
            e2e: true
            seed: false
          - preset: _m1-turso-auth # + Better Auth, client mode
            experimental: false
            e2e: true
            seed: true
          - preset: _m1-turso-internal # + Better Auth, internal mode
            experimental: false
            e2e: true
            seed: false
          - preset: _m1-turso-storage # + R2 uploads
            experimental: false
            e2e: true
            seed: true
          - preset: _m1-turso-example # + the notes reference feature
            experimental: false
            e2e: true
            seed: true
          - preset: _m1-turso-full # + the admin shell: the whole M1 spine
            experimental: false
            e2e: true
            seed: true
          - preset: _m1-turso-orgs # + organizations: the second authz axis
            experimental: false
            e2e: true
            seed: true
          - preset: turso # the shipped preset, now complete
            experimental: false
            e2e: true
            seed: true
          # Postgres configures, typechecks, lints, unit-tests and builds without
          # a database. Everything that needs a live server — migrate, seed,
          # smokes — is the `postgres-integration` job below, which is where the
          # service container lives.
          - preset: postgres # the shipped preset, complete
            experimental: false
            e2e: false
            seed: false
          # The app half of the sqlite profile runs here against a `file:` database
          # like every other lane. The CONTAINER half — entrypoint, Litestream
          # restore, redeploy — is the `container` job below.
          - preset: sqlite # the shipped preset, complete
            experimental: false
            e2e: true
            seed: true
          - preset: static # the shipped preset, complete
            experimental: false
            e2e: true
            seed: false
          # Lands with its milestone. Wired now, and expected to fail with
          # E_MISSING_VARIANT until then — listed rather than omitted so the gap
          # is visible on every run instead of being quietly forgotten.
          - preset: supabase # M5
            experimental: true
            e2e: false
            seed: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure a clean copy
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/app" && mkdir -p "$RUNNER_TEMP/app"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/app"
          cp "scripts/configure/presets/${{ matrix.preset }}.yml" "$RUNNER_TEMP/app/niftic.app.yml"
          cd "$RUNNER_TEMP/app"
          # --no-install here; the generated app installs and verifies below so
          # each step shows up as its own log section.
          "$GITHUB_WORKSPACE/node_modules/.bin/tsx" scripts/configure/index.ts --yes --no-install

      - name: The engine must not have touched the checkout
        run: test -z "$(git status --porcelain)"

      - name: Verify the generated app
        working-directory: ${{ runner.temp }}/app
        env:
          # Enough to satisfy the generated env schema at build time. Never real —
          # and deliberately distinctive, because the bundle check below greps for
          # these exact VALUES.
          TURSO_DATABASE_URL: 'file:./.data/ci.db'
          ORIGIN: 'http://localhost:5173'
          EMAIL_DRY_RUN: 'true'
          BETTER_AUTH_URL: 'http://localhost:5173'
          BETTER_AUTH_SECRET: 'ci-canary-better-auth-secret-2f8a1c'
          RESEND_API_KEY: 'ci-canary-resend-key-9d4b7e'
          R2_SECRET_ACCESS_KEY: 'ci-canary-r2-secret-5a6c3f'
          GOOGLE_CLIENT_SECRET: 'ci-canary-google-secret-71bd94'
        run: |
          set -euo pipefail
          # NOT --frozen-lockfile: the merged package.json is deliberately a
          # strict subset of the superset lock, and CI=true would otherwise make
          # pnpm default to frozen and fail.
          pnpm install --no-frozen-lockfile
          pnpm check
          pnpm lint
          pnpm test:unit
          pnpm build

      - name: Playwright smokes
        if: matrix.e2e
        working-directory: ${{ runner.temp }}/app
        env:
          TURSO_DATABASE_URL: 'file:./.data/ci.db'
          ORIGIN: 'http://localhost:4173'
          BETTER_AUTH_URL: 'http://localhost:4173'
          BETTER_AUTH_SECRET: 'ci-canary-better-auth-secret-2f8a1c'
          RESEND_API_KEY: 'ci-canary-resend-key-9d4b7e'
          EMAIL_FROM: 'no-reply@example.com'
          EMAIL_DRY_RUN: 'true'
          AUTH_ALLOWED_DOMAINS: 'example.com'
          GOOGLE_CLIENT_ID: 'ci-fake-client-id'
          GOOGLE_CLIENT_SECRET: 'ci-canary-google-secret-71bd94'
          ADMIN_EMAIL: 'admin@example.com'
          ADMIN_PASSWORD: 'ci-only-password-2f8a1c'
          # static lane only, and inert elsewhere. EMAIL_DRY_RUN above means the
          # contact smoke logs its payload rather than mailing anyone.
          CONTACT_TO: 'hello@example.com'
          # sqlite lane only, and inert elsewhere. This lane runs the APP against
          # a file; the container and its replica are the `container` job.
          DB_PATH: './.data/ci.db'
          LITESTREAM_BUCKET: 'nf-ci-backups'
          LITESTREAM_ENDPOINT: 'https://ci.example.invalid'
          LITESTREAM_ACCESS_KEY_ID: 'ci-fake-litestream-key'
          LITESTREAM_SECRET_ACCESS_KEY: 'ci-canary-litestream-secret-4e2a91'
          # Presigning is pure computation, so these never contact Cloudflare.
          R2_ACCOUNT_ID: 'ci-fake-account'
          R2_ACCESS_KEY_ID: 'ci-fake-key-id'
          R2_SECRET_ACCESS_KEY: 'ci-canary-r2-secret-5a6c3f'
          R2_BUCKET: 'nf-ci-assets'
        run: |
          set -euo pipefail
          mkdir -p .data
          # Only the lanes with a schema have migrations to run.
          if [ -f drizzle.config.ts ]; then
            pnpm db:generate
            pnpm db:migrate
          fi
          if [ "${{ matrix.seed }}" = "true" ]; then pnpm db:seed; fi
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Upload the trace when a smoke fails
        if: failure() && matrix.e2e
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.preset }}
          path: ${{ runner.temp }}/app/test-results
          retention-days: 7

      - name: Nothing starter-only survived
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          for p in variants scripts/configure .github/workflows/starter-ci.yml .github/workflows/bootstrap.yml; do
            if [ -e "$p" ]; then echo "::error::$p survived configure"; exit 1; fi
          done
          if grep -q '"configure"' package.json; then
            echo "::error::the configure script survived in package.json"; exit 1
          fi

      # Spec §14: a static app's LOCKFILE must contain no database, auth or
      # storage package. Asserted against the installed tree rather than
      # package.json, because a transitive dependency would not show up there —
      # and "we didn't declare it" is a weaker claim than "it isn't installed".
      - name: A static app installs no db, auth or storage package
        if: matrix.preset == 'static'
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          failed=0
          for pkg in @libsql/client drizzle-orm drizzle-kit postgres better-auth \
                     aws4fetch @supabase/supabase-js; do
            if [ -e "node_modules/$pkg" ]; then
              echo "::error::$pkg is installed in a static app"
              failed=1
            fi
          done
          exit $failed

      - name: No credentials in the client bundle
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          [ -d .svelte-kit/output/client ] || exit 0

          # Grep for the VALUES, not the names. Better Auth ships an isomorphic
          # env shim whose getter keys literally include `BETTER_AUTH_SECRET`, so
          # searching for names reports a leak that isn't one. A canary VALUE in
          # the client bundle, on the other hand, is unambiguous.
          failed=0
          for canary in \
            'ci-canary-better-auth-secret-2f8a1c' \
            'ci-canary-resend-key-9d4b7e' \
            'ci-canary-r2-secret-5a6c3f' \
            'ci-canary-google-secret-71bd94'; do
            if grep -rl -- "$canary" .svelte-kit/output/client 2>/dev/null; then
              echo "::error::a server-only secret value reached the client bundle"
              failed=1
            fi
          done
          exit $failed

  postgres-integration:
    name: postgres against a real server
    runs-on: ubuntu-latest
    # The heavy lane. The `preset: postgres` matrix entry above already proves
    # the branch configures, typechecks, lints, unit-tests and builds on every
    # PR; this one proves the SQL is real, and it needs a server to do it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        # Without this the first migration races the server's own startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure a clean copy
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/app" && mkdir -p "$RUNNER_TEMP/app"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/app"
          cp scripts/configure/presets/postgres.yml "$RUNNER_TEMP/app/niftic.app.yml"
          cd "$RUNNER_TEMP/app"
          "$GITHUB_WORKSPACE/node_modules/.bin/tsx" scripts/configure/index.ts --yes --no-install

      - name: Migrate, seed and smoke against postgres:17
        working-directory: ${{ runner.temp }}/app
        env:
          # A loopback host, so `connectionOptions` exempts it from the TLS and
          # pooled-port rules — there is no pooler and no certificate here. That
          # exemption is exactly what makes those rules testable by running them;
          # `connection.test.ts` covers the refusals themselves.
          DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/app'
          ORIGIN: 'http://localhost:4173'
          BETTER_AUTH_URL: 'http://localhost:4173'
          BETTER_AUTH_SECRET: 'ci-canary-better-auth-secret-2f8a1c'
          RESEND_API_KEY: 'ci-canary-resend-key-9d4b7e'
          EMAIL_FROM: 'no-reply@example.com'
          EMAIL_DRY_RUN: 'true'
          ADMIN_EMAIL: 'admin@example.com'
          ADMIN_PASSWORD: 'ci-only-password-2f8a1c'
          R2_ACCOUNT_ID: 'ci-fake-account'
          R2_ACCESS_KEY_ID: 'ci-fake-key-id'
          R2_SECRET_ACCESS_KEY: 'ci-canary-r2-secret-5a6c3f'
          R2_BUCKET: 'nf-ci-assets'
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm db:generate
          pnpm db:migrate
          pnpm db:seed
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Upload the trace when a smoke fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-postgres-integration
          path: ${{ runner.temp }}/app/test-results
          retention-days: 7

  container:
    name: sqlite container — boot, redeploy, restore
    runs-on: ubuntu-latest
    # Spec §14's acceptance test for M3, and the only place it can run: the
    # container boots on an empty volume, survives a redeploy with data intact,
    # and gets its data back from the replica when the volume is destroyed.
    #
    # MinIO stands in for R2. Litestream talks plain S3, so what this proves
    # about the entrypoint, the config format and the restore flags holds
    # against R2 too; what it does NOT prove is anything about R2 itself.
    env:
      DB_PATH: /data/app.db
      APP_PORT: '3000'
      LITESTREAM_BUCKET: backups
      LITESTREAM_ENDPOINT: http://127.0.0.1:9000
      LITESTREAM_ACCESS_KEY_ID: minioadmin
      LITESTREAM_SECRET_ACCESS_KEY: minioadmin
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-password-2f8a1c
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure a clean copy
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/app" && mkdir -p "$RUNNER_TEMP/app"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/app"
          cp scripts/configure/presets/sqlite.yml "$RUNNER_TEMP/app/niftic.app.yml"
          cd "$RUNNER_TEMP/app"
          "$GITHUB_WORKSPACE/node_modules/.bin/tsx" scripts/configure/index.ts --yes --no-install

      - name: Start MinIO and create the backups bucket
        run: |
          set -euo pipefail
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          docker run --rm --network host --entrypoint sh minio/mc -c \
            "mc alias set ci http://127.0.0.1:9000 minioadmin minioadmin && \
             mc mb --ignore-existing ci/backups"

      - name: Build the image
        run: docker build -t niftic-app:ci "$RUNNER_TEMP/app"

      # Every run of the container uses this same argument list. Written once so
      # the three boots below cannot drift apart.
      - name: Write the run helper
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/run-app.sh" <<'EOF'
          #!/bin/sh
          set -eu
          docker run -d --name app --network host \
            -v app-data:/data \
            -e DB_PATH="$DB_PATH" \
            -e PORT="$APP_PORT" \
            -e ORIGIN="http://127.0.0.1:$APP_PORT" \
            -e BETTER_AUTH_URL="http://127.0.0.1:$APP_PORT" \
            -e BETTER_AUTH_SECRET=ci-canary-better-auth-secret-2f8a1c \
            -e RESEND_API_KEY=ci-canary-resend-key-9d4b7e \
            -e EMAIL_FROM=no-reply@example.com \
            -e EMAIL_DRY_RUN=true \
            -e R2_ACCOUNT_ID=ci-fake-account \
            -e R2_ACCESS_KEY_ID=ci-fake-key-id \
            -e R2_SECRET_ACCESS_KEY=ci-canary-r2-secret-5a6c3f \
            -e R2_BUCKET=nf-ci-assets \
            -e LITESTREAM_BUCKET="$LITESTREAM_BUCKET" \
            -e LITESTREAM_ENDPOINT="$LITESTREAM_ENDPOINT" \
            -e LITESTREAM_ACCESS_KEY_ID="$LITESTREAM_ACCESS_KEY_ID" \
            -e LITESTREAM_SECRET_ACCESS_KEY="$LITESTREAM_SECRET_ACCESS_KEY" \
            niftic-app:ci
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$APP_PORT/api/health" >/dev/null 2>&1; then
              echo "app is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the app never became healthy"
          docker logs app
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/run-app.sh"

      - name: Boot on an EMPTY volume, then seed
        run: |
          set -euo pipefail
          docker volume create app-data
          "$RUNNER_TEMP/run-app.sh"

          # The seed is not part of the entrypoint — an app that reseeds on every
          # deploy is a different kind of bug. Run it once, by hand, as an
          # operator would.
          docker exec \
            -e TURSO_DATABASE_URL="file:$DB_PATH" \
            -e ADMIN_EMAIL="$ADMIN_EMAIL" \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            app node_modules/.bin/tsx scripts/seed.ts

          # Signing in proves the user row AND its credential account are really
          # there — a stronger assertion than reading the file.
          curl -fsS -X POST "http://127.0.0.1:$APP_PORT/api/auth/sign-in/email" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -o /dev/null

          # WAL is what Litestream replicates. If the boot migration left the file
          # in rollback-journal mode, this is where we find out.
          docker exec app sh -c \
            "node -e \"import('@libsql/client').then(async (m) => {
               const c = m.createClient({ url: 'file:$DB_PATH' });
               const r = await c.execute('PRAGMA journal_mode');
               if (r.rows[0].journal_mode !== 'wal') { console.error('not WAL:', r.rows); process.exit(1); }
               console.log('journal_mode is wal');
               c.close();
             })\""

          # sync-interval is 1s; give the replica time to catch up before the
          # volume is destroyed two steps from now.
          sleep 10

      - name: Redeploy on the SAME volume — data must survive
        run: |
          set -euo pipefail
          docker stop -t 30 app && docker rm app
          "$RUNNER_TEMP/run-app.sh"

          # No restore involved here: the database was already on the volume, and
          # -if-db-not-exists means the entrypoint left it alone.
          curl -fsS -X POST "http://127.0.0.1:$APP_PORT/api/auth/sign-in/email" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -o /dev/null
          echo "data survived a redeploy"

      - name: Destroy the volume — data must come back from the replica
        run: |
          set -euo pipefail
          docker stop -t 30 app && docker rm app
          docker volume rm app-data
          docker volume create app-data

          # This is the drill the whole profile rests on: a replacement volume,
          # and the only copy of the data is in object storage.
          "$RUNNER_TEMP/run-app.sh"

          docker logs app 2>&1 | head -20

          curl -fsS -X POST "http://127.0.0.1:$APP_PORT/api/auth/sign-in/email" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -o /dev/null
          echo "data was restored from the replica"

      - name: Container logs on failure
        if: failure()
        run: |
          echo '--- app ---';   docker logs app   2>&1 | tail -100 || true
          echo '--- minio ---'; docker logs minio 2>&1 | tail -30  || true
