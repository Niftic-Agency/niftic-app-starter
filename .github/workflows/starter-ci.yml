name: starter

# The starter's own CI. Deleted by `pnpm configure`, so it never runs in a
# generated app.
#
# The product here is the GENERATOR, not any single app, so the job that matters
# most is `preset`: it configures a fresh copy per profile and then runs that
# app's own checks. A green `engine` job is necessary but nowhere near sufficient.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: starter-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  engine:
    name: engine + base tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:unit
      # The superset builds using the provisional adapter. If base stops
      # building, we want to know on the PR that broke it, not in the matrix.
      - run: pnpm build

      # Spec §14: a direct Postgres connection string must not appear as an
      # EXAMPLE anywhere. Prose telling you never to use one is fine, and so is
      # the negative fixture in connection.test.ts — this looks for a remote
      # `postgres://…:5432` that someone might copy.
      - name: No direct Postgres connection string in docs or examples
        run: |
          set -euo pipefail
          if grep -rnE 'postgres(ql)?://[^ "'"'"']*:5432' \
               docs README.md variants/*/variant.json scripts/configure/presets \
               2>/dev/null | grep -v 'localhost\|127\.0\.0\.1'; then
            echo "::error::a direct Postgres connection string is being shown as an example"
            exit 1
          fi

  determinism:
    name: deterministic output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure the same manifest twice and diff, with no exclusions
        run: |
          set -euo pipefail
          for n in a b; do
            rm -rf "$RUNNER_TEMP/$n" && mkdir -p "$RUNNER_TEMP/$n"
            # git archive respects .gitignore, so node_modules and .svelte-kit
            # never come along. cp -r would drag both.
            git archive HEAD | tar -x -C "$RUNNER_TEMP/$n"
            cp scripts/configure/presets/_m0-turso-minimal.yml "$RUNNER_TEMP/$n/niftic.app.yml"
            ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/$n/node_modules"
            ( cd "$RUNNER_TEMP/$n" && SOURCE_DATE_EPOCH=0 \
                node_modules/.bin/tsx scripts/configure/index.ts --yes --no-install )
            # Unlink before the diff, or it compares two copies of the workspace's
            # node_modules as well.
            rm "$RUNNER_TEMP/$n/node_modules"
          done
          # SOURCE_DATE_EPOCH pins the one non-deterministic field (generated.at),
          # so this diff needs no exclusions at all.
          diff -r "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"

  bootstrap:
    name: bootstrap round-trip
    runs-on: ubuntu-latest
    # apps.niftic.com's path: create a repo from this template, commit a
    # manifest, dispatch bootstrap.yml, then poll for the commit. Everything
    # except the dispatch itself is reproducible here — including the push,
    # against a bare repo standing in for GitHub.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: A repo created from the template, with a manifest committed
        run: |
          set -euo pipefail
          # -b main on the BARE repo too. Without it the remote's HEAD points at
          # whatever init.defaultBranch says — `master` on a runner — and since
          # nothing is ever pushed there, `git clone` below checks out an empty
          # tree and every assertion fails on a missing file instead of a wrong
          # one.
          git init -q --bare -b main "$RUNNER_TEMP/remote.git"
          rm -rf "$RUNNER_TEMP/repo" && mkdir -p "$RUNNER_TEMP/repo"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          cp scripts/configure/presets/turso.yml niftic.app.yml
          git init -q -b main
          git remote add origin "$RUNNER_TEMP/remote.git"
          git add -A
          git -c user.name=provisioner -c user.email=bot@niftic.agency \
            commit -qm 'chore: commit the manifest'
          git push -q -u origin main

      # Run bootstrap.yml's OWN steps rather than a transcription of them. A
      # transcription drifts, and the drift is invisible until a real dispatch
      # fails on a customer's repo.
      - name: Extract what the dispatch would run
        # Stated rather than inherited: `yaml` resolves from the cwd, and this
        # step is the only one in the job that needs the workspace's node_modules.
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            import { parse } from 'yaml';
            const wf = parse(readFileSync(process.env.GITHUB_WORKSPACE + '/.github/workflows/bootstrap.yml', 'utf8'));
            const runs = wf.jobs.configure.steps.filter((s) => s.run).map((s) => s.run);
            if (runs.length < 4) throw new Error('expected the guard, install, configure and commit steps');
            writeFileSync(process.env.RUNNER_TEMP + '/bootstrap.sh', ['set -euo pipefail', ...runs].join('\n'));
          "
          cat "$RUNNER_TEMP/bootstrap.sh"

      - name: Dispatch
        working-directory: ${{ runner.temp }}/repo
        run: bash "$RUNNER_TEMP/bootstrap.sh"

      - name: What the provisioner polls for
        run: |
          set -euo pipefail
          git -C "$RUNNER_TEMP/remote.git" log -1 --format=%s | grep -qx 'chore: configure app (turso)'

          rm -rf "$RUNNER_TEMP/polled"
          git clone -q "$RUNNER_TEMP/remote.git" "$RUNNER_TEMP/polled"
          cd "$RUNNER_TEMP/polled"
          # Said out loud, because an empty checkout passes every "is it gone?"
          # assertion below and fails only the "is it there?" ones — which reads
          # like a prune bug rather than a clone that produced nothing.
          test -f package.json || { echo "::error::the clone is empty"; exit 1; }

          grep -qE '^generated:' niftic.app.yml
          test -f .github/workflows/ci.yml
          test -f AGENTS.md
          test -f .agents/niftic-app/GUIDE.md
          test -f .claude/skills/niftic-app/SKILL.md
          # The configuring commit is also the one that removes the bootstrapper,
          # so the repo it lands in cannot be bootstrapped a second time.
          for p in variants scripts/configure \
                   .github/workflows/bootstrap.yml .github/workflows/starter-ci.yml \
                   docs/architecture.md .agents/niftic-app/references/setup.md; do
            if [ -e "$p" ]; then echo "::error::$p survived the bootstrap"; exit 1; fi
          done

      - name: A second dispatch refuses
        working-directory: ${{ runner.temp }}/polled
        run: |
          set -euo pipefail
          if bash "$RUNNER_TEMP/bootstrap.sh"; then
            echo "::error::a configured repo let itself be bootstrapped again"
            exit 1
          fi
          echo "the guard held"

  preset:
    name: preset ${{ matrix.preset }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Implemented today. `seed` marks the lanes that have a user table and
          # therefore an admin to sign the auth smoke in as.
          - preset: _m0-turso-minimal # db + host only
            experimental: false
            e2e: true
            seed: false
          - preset: _m1-turso-auth # + Better Auth, client mode
            experimental: false
            e2e: true
            seed: true
          - preset: _m1-turso-internal # + Better Auth, internal mode
            experimental: false
            e2e: true
            seed: false
          - preset: _m1-turso-storage # + R2 uploads
            experimental: false
            e2e: true
            seed: true
          - preset: _m1-turso-example # + the notes reference feature
            experimental: false
            e2e: true
            seed: true
          - preset: _m1-turso-full # + the admin shell: the whole M1 spine
            experimental: false
            e2e: true
            seed: true
          - preset: _m1-turso-orgs # + organizations: the second authz axis
            experimental: false
            e2e: true
            seed: true
          - preset: turso # the shipped preset, now complete
            experimental: false
            e2e: true
            seed: true
          # Postgres configures, typechecks, lints, unit-tests and builds without
          # a database. Everything that needs a live server — migrate, seed,
          # smokes — is the `postgres-integration` job below, which is where the
          # service container lives.
          - preset: postgres # the shipped preset, complete
            experimental: false
            e2e: false
            seed: false
          # The app half of the sqlite profile runs here against a `file:` database
          # like every other lane. The CONTAINER half — entrypoint, Litestream
          # restore, redeploy — is the `container` job below.
          - preset: sqlite # the shipped preset, complete
            experimental: false
            e2e: true
            seed: true
          - preset: static # the shipped preset, complete
            experimental: false
            e2e: true
            seed: false
          # The app half of the Supabase fork. Everything that needs the local
          # stack — migrations, policy tests, the RLS check against a real
          # database — is the `supabase-integration` job below.
          - preset: supabase # the shipped preset, complete
            experimental: false
            e2e: false
            seed: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure a clean copy
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/app" && mkdir -p "$RUNNER_TEMP/app"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/app"
          cp "scripts/configure/presets/${{ matrix.preset }}.yml" "$RUNNER_TEMP/app/niftic.app.yml"
          cd "$RUNNER_TEMP/app"
          # The engine imports `yaml` and `zod`, and node resolves those from the
          # directory of the script it is running — which is this copy, not the
          # checkout. $RUNNER_TEMP is not under $GITHUB_WORKSPACE, so no upward
          # walk reaches the installed tree either. Borrow the workspace's
          # node_modules for the length of the run; a second superset install per
          # lane would cost minutes across the matrix.
          ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
          # --no-install here; the generated app installs and verifies below so
          # each step shows up as its own log section.
          node_modules/.bin/tsx scripts/configure/index.ts --yes --no-install
          # Unlink before anything else runs. From here on the app must resolve
          # only what its OWN package.json installs — otherwise every assertion
          # below about what a profile does and does not carry is worthless, and
          # a variant that forgot to declare a dependency would still build.
          rm node_modules

      - name: The engine must not have touched the checkout
        run: test -z "$(git status --porcelain)"

      - name: Verify the generated app
        working-directory: ${{ runner.temp }}/app
        env:
          # Enough to satisfy the generated env schema at build time. Never real —
          # and deliberately distinctive, because the bundle check below greps for
          # these exact VALUES.
          TURSO_DATABASE_URL: 'file:./.data/ci.db'
          ORIGIN: 'http://localhost:5173'
          EMAIL_DRY_RUN: 'true'
          BETTER_AUTH_URL: 'http://localhost:5173'
          BETTER_AUTH_SECRET: 'ci-canary-better-auth-secret-2f8a1c'
          RESEND_API_KEY: 'ci-canary-resend-key-9d4b7e'
          R2_SECRET_ACCESS_KEY: 'ci-canary-r2-secret-5a6c3f'
          GOOGLE_CLIENT_SECRET: 'ci-canary-google-secret-71bd94'
        run: |
          set -euo pipefail
          # NOT --frozen-lockfile: the merged package.json is deliberately a
          # strict subset of the superset lock, and CI=true would otherwise make
          # pnpm default to frozen and fail.
          pnpm install --no-frozen-lockfile
          pnpm check
          pnpm lint
          pnpm test:unit
          pnpm build

      - name: Playwright smokes
        if: matrix.e2e
        working-directory: ${{ runner.temp }}/app
        env:
          TURSO_DATABASE_URL: 'file:./.data/ci.db'
          ORIGIN: 'http://localhost:4173'
          BETTER_AUTH_URL: 'http://localhost:4173'
          BETTER_AUTH_SECRET: 'ci-canary-better-auth-secret-2f8a1c'
          RESEND_API_KEY: 'ci-canary-resend-key-9d4b7e'
          EMAIL_FROM: 'no-reply@example.com'
          EMAIL_DRY_RUN: 'true'
          AUTH_ALLOWED_DOMAINS: 'example.com'
          GOOGLE_CLIENT_ID: 'ci-fake-client-id'
          GOOGLE_CLIENT_SECRET: 'ci-canary-google-secret-71bd94'
          ADMIN_EMAIL: 'admin@example.com'
          ADMIN_PASSWORD: 'ci-only-password-2f8a1c'
          # static lane only, and inert elsewhere. EMAIL_DRY_RUN above means the
          # contact smoke logs its payload rather than mailing anyone.
          CONTACT_TO: 'hello@example.com'
          # sqlite lane only, and inert elsewhere. This lane runs the APP against
          # a file; the container and its replica are the `container` job.
          DB_PATH: './.data/ci.db'
          LITESTREAM_BUCKET: 'nf-ci-backups'
          LITESTREAM_ENDPOINT: 'https://ci.example.invalid'
          LITESTREAM_ACCESS_KEY_ID: 'ci-fake-litestream-key'
          LITESTREAM_SECRET_ACCESS_KEY: 'ci-canary-litestream-secret-4e2a91'
          # Presigning is pure computation, so these never contact Cloudflare.
          R2_ACCOUNT_ID: 'ci-fake-account'
          R2_ACCESS_KEY_ID: 'ci-fake-key-id'
          R2_SECRET_ACCESS_KEY: 'ci-canary-r2-secret-5a6c3f'
          R2_BUCKET: 'nf-ci-assets'
        run: |
          set -euo pipefail
          mkdir -p .data
          # Only the lanes with a schema have migrations to run.
          if [ -f drizzle.config.ts ]; then
            pnpm db:generate
            pnpm db:migrate
          fi
          if [ "${{ matrix.seed }}" = "true" ]; then pnpm db:seed; fi
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Upload the trace when a smoke fails
        if: failure() && matrix.e2e
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.preset }}
          path: ${{ runner.temp }}/app/test-results
          retention-days: 7

      - name: Nothing starter-only survived
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          for p in variants scripts/configure \
                   .github/workflows/starter-ci.yml .github/workflows/bootstrap.yml \
                   docs/architecture.md \
                   .agents/niftic-app/references/setup.md; do
            if [ -e "$p" ]; then echo "::error::$p survived configure"; exit 1; fi
          done
          if grep -q '"configure"' package.json; then
            echo "::error::the configure script survived in package.json"; exit 1
          fi

      - name: Every agent has an entry point, and it teaches only this app's stack
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          # The vendor-neutral pair, plus the adapters that point at it.
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f .github/copilot-instructions.md
          test -f .agents/niftic-app/GUIDE.md
          test -f .claude/skills/niftic-app/SKILL.md

          # AGENTS.md is regenerated, so it must not still be describing a
          # superset and a configure engine that no longer exist.
          for f in AGENTS.md README.md; do
            if grep -qi 'variants/\|pnpm configure' "$f"; then
              echo "::error::$f is still the starter's"; exit 1
            fi
          done
          # CLAUDE.md is a pointer, not a second copy. If it grows the rules
          # back, they are being maintained twice and one of them will go stale.
          if ! grep -q 'AGENTS.md' CLAUDE.md; then
            echo "::error::CLAUDE.md does not point at AGENTS.md"; exit 1
          fi
          if [ "$(wc -l < CLAUDE.md)" -gt 20 ]; then
            echo "::error::CLAUDE.md is longer than a pointer needs to be"; exit 1
          fi
          # Same for the skill: its job is to route to the guide, not restate it.
          if ! grep -q '.agents/niftic-app/GUIDE.md' .claude/skills/niftic-app/SKILL.md; then
            echo "::error::the skill does not point at the shared guide"; exit 1
          fi

          # References arrive with the variant that owns them. Nothing from
          # another branch may be present.
          echo "references: $(ls .agents/niftic-app/references 2>/dev/null | tr '\n' ' ')"
          case "${{ matrix.preset }}" in
            static)
              test -f .agents/niftic-app/references/static.md
              for taught in data.md auth.md orgs.md; do
                if [ -e ".agents/niftic-app/references/$taught" ]; then
                  echo "::error::a static app was taught $taught"; exit 1
                fi
              done
              ;;
            supabase)
              # The fork's whole security model. If this sentence is missing, the
              # app shipped the Drizzle reference or none at all.
              grep -q 'row level security' .agents/niftic-app/references/data.md
              ;;
            *)
              test -f .agents/niftic-app/references/data.md
              if grep -q 'row level security' .agents/niftic-app/references/data.md; then
                echo "::error::a Drizzle app shipped the Supabase reference"; exit 1
              fi
              ;;
          esac

      # Spec §14: a static app's LOCKFILE must contain no database, auth or
      # storage package. Asserted against the installed tree rather than
      # package.json, because a transitive dependency would not show up there —
      # and "we didn't declare it" is a weaker claim than "it isn't installed".
      - name: A static app installs no db, auth or storage package
        if: matrix.preset == 'static'
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          failed=0
          for pkg in @libsql/client drizzle-orm drizzle-kit postgres better-auth \
                     aws4fetch @supabase/supabase-js; do
            # Top level catches a declared dependency. pnpm's isolated layout puts
            # a TRANSITIVE one under .pnpm/ and nowhere else, so checking only the
            # top level answers a weaker question than the one this step asks —
            # and would miss exactly the leak that arrives without being declared.
            if [ -e "node_modules/$pkg" ]; then
              echo "::error::$pkg is installed in a static app"
              failed=1
            fi
            if compgen -G "node_modules/.pnpm/${pkg/\//+}@*" > /dev/null; then
              echo "::error::$pkg reached a static app transitively"
              failed=1
            fi
          done
          exit $failed

      - name: No credentials in the client bundle
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          [ -d .svelte-kit/output/client ] || exit 0

          # Grep for the VALUES, not the names. Better Auth ships an isomorphic
          # env shim whose getter keys literally include `BETTER_AUTH_SECRET`, so
          # searching for names reports a leak that isn't one. A canary VALUE in
          # the client bundle, on the other hand, is unambiguous.
          failed=0
          for canary in \
            'ci-canary-better-auth-secret-2f8a1c' \
            'ci-canary-resend-key-9d4b7e' \
            'ci-canary-r2-secret-5a6c3f' \
            'ci-canary-google-secret-71bd94'; do
            if grep -rl -- "$canary" .svelte-kit/output/client 2>/dev/null; then
              echo "::error::a server-only secret value reached the client bundle"
              failed=1
            fi
          done
          exit $failed

  postgres-integration:
    name: postgres against a real server
    runs-on: ubuntu-latest
    # The heavy lane. The `preset: postgres` matrix entry above already proves
    # the branch configures, typechecks, lints, unit-tests and builds on every
    # PR; this one proves the SQL is real, and it needs a server to do it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        # Without this the first migration races the server's own startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure a clean copy
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/app" && mkdir -p "$RUNNER_TEMP/app"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/app"
          cp scripts/configure/presets/postgres.yml "$RUNNER_TEMP/app/niftic.app.yml"
          cd "$RUNNER_TEMP/app"
          # Borrowed for the length of the run, then unlinked — see the `preset`
          # job for why both halves of that matter.
          ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
          node_modules/.bin/tsx scripts/configure/index.ts --yes --no-install
          rm node_modules

      - name: Migrate, seed and smoke against postgres:17
        working-directory: ${{ runner.temp }}/app
        env:
          # A loopback host, so `connectionOptions` exempts it from the TLS and
          # pooled-port rules — there is no pooler and no certificate here. That
          # exemption is exactly what makes those rules testable by running them;
          # `connection.test.ts` covers the refusals themselves.
          DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/app'
          ORIGIN: 'http://localhost:4173'
          BETTER_AUTH_URL: 'http://localhost:4173'
          BETTER_AUTH_SECRET: 'ci-canary-better-auth-secret-2f8a1c'
          RESEND_API_KEY: 'ci-canary-resend-key-9d4b7e'
          EMAIL_FROM: 'no-reply@example.com'
          EMAIL_DRY_RUN: 'true'
          ADMIN_EMAIL: 'admin@example.com'
          ADMIN_PASSWORD: 'ci-only-password-2f8a1c'
          R2_ACCOUNT_ID: 'ci-fake-account'
          R2_ACCESS_KEY_ID: 'ci-fake-key-id'
          R2_SECRET_ACCESS_KEY: 'ci-canary-r2-secret-5a6c3f'
          R2_BUCKET: 'nf-ci-assets'
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm db:generate
          pnpm db:migrate
          pnpm db:seed
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Upload the trace when a smoke fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-postgres-integration
          path: ${{ runner.temp }}/app/test-results
          retention-days: 7

  container:
    name: sqlite container — boot, redeploy, restore
    runs-on: ubuntu-latest
    # Spec §14's acceptance test for M3, and the only place it can run: the
    # container boots on an empty volume, survives a redeploy with data intact,
    # and gets its data back from the replica when the volume is destroyed.
    #
    # MinIO stands in for R2. Litestream talks plain S3, so what this proves
    # about the entrypoint, the config format and the restore flags holds
    # against R2 too; what it does NOT prove is anything about R2 itself.
    env:
      DB_PATH: /data/app.db
      APP_PORT: '3000'
      LITESTREAM_BUCKET: backups
      LITESTREAM_ENDPOINT: http://127.0.0.1:9000
      LITESTREAM_ACCESS_KEY_ID: minioadmin
      LITESTREAM_SECRET_ACCESS_KEY: minioadmin
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-password-2f8a1c
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure a clean copy
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/app" && mkdir -p "$RUNNER_TEMP/app"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/app"
          cp scripts/configure/presets/sqlite.yml "$RUNNER_TEMP/app/niftic.app.yml"
          cd "$RUNNER_TEMP/app"
          # Borrowed for the length of the run, then unlinked — see the `preset`
          # job. Here the unlink also keeps the symlink out of the docker build
          # context two steps down.
          ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
          node_modules/.bin/tsx scripts/configure/index.ts --yes --no-install
          rm node_modules

      - name: Generate the migrations the image expects to find committed
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          # A real app commits `drizzle/` — the entrypoint applies those files on
          # boot, and the Dockerfile COPYs them into the runner. The starter
          # cannot commit them, because the schema does not exist until a profile
          # is chosen. So generate them here, into the build context, exactly
          # where a developer's committed migrations would be.
          pnpm install --no-frozen-lockfile
          pnpm db:generate
          test -d drizzle

      - name: Start MinIO and create the backups bucket
        run: |
          set -euo pipefail
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          docker run --rm --network host --entrypoint sh minio/mc -c \
            "mc alias set ci http://127.0.0.1:9000 minioadmin minioadmin && \
             mc mb --ignore-existing ci/backups"

      - name: Build the image
        run: docker build -t niftic-app:ci "$RUNNER_TEMP/app"

      # Every run of the container uses this same argument list. Written once so
      # the three boots below cannot drift apart.
      - name: Write the run helper
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/run-app.sh" <<'EOF'
          #!/bin/sh
          set -eu
          docker run -d --name app --network host \
            -v app-data:/data \
            -e DB_PATH="$DB_PATH" \
            -e PORT="$APP_PORT" \
            -e ORIGIN="http://127.0.0.1:$APP_PORT" \
            -e BETTER_AUTH_URL="http://127.0.0.1:$APP_PORT" \
            -e BETTER_AUTH_SECRET=ci-canary-better-auth-secret-2f8a1c \
            -e RESEND_API_KEY=ci-canary-resend-key-9d4b7e \
            -e EMAIL_FROM=no-reply@example.com \
            -e EMAIL_DRY_RUN=true \
            -e R2_ACCOUNT_ID=ci-fake-account \
            -e R2_ACCESS_KEY_ID=ci-fake-key-id \
            -e R2_SECRET_ACCESS_KEY=ci-canary-r2-secret-5a6c3f \
            -e R2_BUCKET=nf-ci-assets \
            -e LITESTREAM_BUCKET="$LITESTREAM_BUCKET" \
            -e LITESTREAM_ENDPOINT="$LITESTREAM_ENDPOINT" \
            -e LITESTREAM_ACCESS_KEY_ID="$LITESTREAM_ACCESS_KEY_ID" \
            -e LITESTREAM_SECRET_ACCESS_KEY="$LITESTREAM_SECRET_ACCESS_KEY" \
            niftic-app:ci
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$APP_PORT/api/health" >/dev/null 2>&1; then
              echo "app is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the app never became healthy"
          # Through ::error:: so it reaches the job's ANNOTATIONS, not only the
          # raw log. The annotation is what a reviewer sees first, and it is the
          # only part readable without permission to download logs.
          code="$(curl -s -o /tmp/health.out -w '%{http_code}' "http://127.0.0.1:$APP_PORT/api/health" || true)"
          echo "::error::last /api/health status: ${code:-no response}"
          echo "::error::body: $(head -c 300 /tmp/health.out 2>/dev/null | tr '\n' ' ')"
          docker logs app 2>&1 | tail -15 | while IFS= read -r line; do
            echo "::error::app: $line"
          done
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/run-app.sh"

      - name: Boot on an EMPTY volume, then seed
        run: |
          set -euo pipefail
          docker volume create app-data
          "$RUNNER_TEMP/run-app.sh"

          # The seed is not part of the entrypoint — an app that reseeds on every
          # deploy is a different kind of bug. Run it once, by hand, as an
          # operator would.
          docker exec \
            -e TURSO_DATABASE_URL="file:$DB_PATH" \
            -e ADMIN_EMAIL="$ADMIN_EMAIL" \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            app node_modules/.bin/tsx scripts/seed.ts

          # Signing in proves the user row AND its credential account are really
          # there — a stronger assertion than reading the file.
          curl -fsS -X POST "http://127.0.0.1:$APP_PORT/api/auth/sign-in/email" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -o /dev/null

          # WAL is what Litestream replicates. If the boot migration left the file
          # in rollback-journal mode, this is where we find out.
          docker exec app sh -c \
            "node -e \"import('@libsql/client').then(async (m) => {
               const c = m.createClient({ url: 'file:$DB_PATH' });
               const r = await c.execute('PRAGMA journal_mode');
               if (r.rows[0].journal_mode !== 'wal') { console.error('not WAL:', r.rows); process.exit(1); }
               console.log('journal_mode is wal');
               c.close();
             })\""

          # sync-interval is 1s; give the replica time to catch up before the
          # volume is destroyed two steps from now.
          sleep 10

      - name: Redeploy on the SAME volume — data must survive
        run: |
          set -euo pipefail
          docker stop -t 30 app && docker rm app
          "$RUNNER_TEMP/run-app.sh"

          # No restore involved here: the database was already on the volume, and
          # -if-db-not-exists means the entrypoint left it alone.
          curl -fsS -X POST "http://127.0.0.1:$APP_PORT/api/auth/sign-in/email" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -o /dev/null
          echo "data survived a redeploy"

      - name: Destroy the volume — data must come back from the replica
        run: |
          set -euo pipefail
          docker stop -t 30 app && docker rm app
          docker volume rm app-data
          docker volume create app-data

          # This is the drill the whole profile rests on: a replacement volume,
          # and the only copy of the data is in object storage.
          "$RUNNER_TEMP/run-app.sh"

          docker logs app 2>&1 | head -20

          curl -fsS -X POST "http://127.0.0.1:$APP_PORT/api/auth/sign-in/email" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -o /dev/null
          echo "data was restored from the replica"

      - name: Container logs on failure
        if: failure()
        run: |
          echo '--- app ---';   docker logs app   2>&1 | tail -100 || true
          echo '--- minio ---'; docker logs minio 2>&1 | tail -30  || true

  supabase-integration:
    name: supabase against the local stack
    runs-on: ubuntu-latest
    # The fork's heavy lane, and the only place spec §14's acceptance criteria
    # for M5 can be met: `check:rls` against real migrations, and policy tests
    # that hold a publishable key the way an attacker would and watch the
    # DATABASE refuse. Needs Docker, which `supabase start` brings up.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure a clean copy
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/app" && mkdir -p "$RUNNER_TEMP/app"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/app"
          cp scripts/configure/presets/supabase.yml "$RUNNER_TEMP/app/niftic.app.yml"
          cd "$RUNNER_TEMP/app"
          # Borrowed for the length of the run, then unlinked — see the `preset`
          # job. The unlink has to happen before the install below, which must
          # start from an empty tree.
          ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
          node_modules/.bin/tsx scripts/configure/index.ts --yes --no-install
          rm node_modules
          pnpm install --no-frozen-lockfile

      # Before anything is applied. This is the check that catches the most
      # dangerous mistake available on this branch, and it needs no database —
      # so it runs first and fails fast.
      - name: check:rls
        working-directory: ${{ runner.temp }}/app
        run: pnpm check:rls

      - name: check:rls must FAIL a migration that forgets RLS
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          # A check that cannot fail is not a check. Prove it rejects the exact
          # mistake it exists for, then take the bad migration away again.
          cat > supabase/migrations/29990101000000_ci_bad.sql <<'SQL'
          create table ci_unprotected (id uuid primary key, secret text not null);
          SQL
          if pnpm check:rls; then
            echo "::error::check:rls passed a table with no row level security"
            rm -f supabase/migrations/29990101000000_ci_bad.sql
            exit 1
          fi
          rm -f supabase/migrations/29990101000000_ci_bad.sql
          echo "check:rls correctly rejected it"

      - name: Start the local stack and apply migrations
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          pnpm exec supabase start
          pnpm exec supabase db reset --no-seed

      - name: Export the local stack's keys
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          # `status -o env` prints the local anon/service keys. They are fixed
          # development values, identical on every machine, and are not secrets.
          pnpm exec supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          {
            echo "PUBLIC_SUPABASE_URL=$API_URL"
            echo "PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # Spec §14's acceptance criterion for M5, so it runs before the hygiene
      # check below: a formatting difference in generated types must not be what
      # stops anyone finding out whether the policies hold.
      - name: Policy tests and smokes
        working-directory: ${{ runner.temp }}/app
        env:
          ORIGIN: 'http://localhost:4173'
          RESEND_API_KEY: 'ci-canary-resend-key-9d4b7e'
          EMAIL_FROM: 'no-reply@example.com'
          EMAIL_DRY_RUN: 'true'
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Types must not have drifted from the schema
        working-directory: ${{ runner.temp }}/app
        run: |
          set -euo pipefail
          # Committed types that disagree with the schema are worse than none:
          # they are confidently wrong, and every editor believes them.
          cp src/lib/database.types.ts /tmp/types-committed.ts
          pnpm types:gen
          if ! diff -u /tmp/types-committed.ts src/lib/database.types.ts > /tmp/types.diff; then
            cat /tmp/types.diff
            echo "::error::src/lib/database.types.ts is stale — run pnpm types:gen and commit"
            # The generated file itself, compressed, as annotations.
            #
            # `types:gen` only runs against a live stack, so whoever sees this
            # failure may have no way to produce the file themselves — and the
            # artifact below needs permission to download, which an annotation
            # does not. Two limits shape this: a message is truncated at 4096
            # characters, and a step may emit ten annotations. Raw text hit the
            # first (a 19KB file arrived a third complete); one line per
            # annotation hit the second. gzip+base64 fits this file in one or two
            # messages, because generated types repeat Row/Insert/Update three
            # times per table and compress about eight to one.
            #
            #   printf '%s' "<joined parts>" | base64 -d | gunzip > src/lib/database.types.ts
            payload="$(gzip -9c src/lib/database.types.ts | base64 | tr -d '\n')"
            echo "::error::database.types.ts follows as gzip+base64 in $(( (${#payload} + 3499) / 3500 )) part(s), ${#payload} chars"
            offset=1
            part=1
            while [ "$offset" -le "${#payload}" ]; do
              echo "::error title=types.gz part ${part}::$(printf '%s' "$payload" | cut -c "${offset}-$((offset + 3499))")"
              offset=$((offset + 3500))
              part=$((part + 1))
            done
            exit 1
          fi

      # The file left on disk after that step IS the generator's output, so this
      # hands over the exact bytes to commit rather than a diff to retype.
      - name: Upload the generated types when they drift
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-types-generated
          path: ${{ runner.temp }}/app/src/lib/database.types.ts
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        working-directory: ${{ runner.temp }}/app
        run: pnpm exec supabase status || true
